# Wikidata SPARQL enrichment settings (read by recsys.data.wikidata).

endpoint = "https://query.wikidata.org/sparql"
# Wikimedia asks for a descriptive User-Agent with a way to reach you. Add a contact
# (URL or email) here if you want one; nothing personal is sent by default.
# TODO: add your GitHub repo URL inside the parentheses, e.g. "(https://github.com/<user>/<repo>; ...)".
user_agent = "recsys-news-graph/0.1 (personal research project; batch SPARQL enrichment of MIND entities)"

entity_batch_size = 200      # entities per query (label + P31)
type_batch_size = 50         # P31 type IDs per query (P279* classification)
pause_seconds = 1.0          # pause between requests
max_retries = 5              # on 429 / 5xx / timeouts, with Retry-After or exponential backoff
timeout_seconds = 60
