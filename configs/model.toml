# GNN recommender settings (Milestone 3). See docs/decisions/006 for the feature choices.

[text_encoder]
model = "sentence-transformers/all-MiniLM-L6-v2"   # frozen; article text = title + " " + abstract
dim = 384
batch_size = 256
normalize = true        # L2-normalised embeddings (cosine-ready)

[features]
entity_vector_dim = 100  # MIND entity_embedding.vec (TransE on Wikidata)
entity_type_dim = 64     # learnable embedding per coarse entity type

[gnn]
hidden_dim = 128
num_layers = 2
fanout = [10, 5]         # max sampled neighbours per edge type, layer 1 and layer 2
dropout = 0.2           # starting value, tuned on validation (ADR 008)

[user]
max_history = 50         # most recent history articles (last items of the history column)

[train]                  # ADR 008
negatives = 4            # non-clicked articles from the same impression per click
batch_size = 256         # clicks per step
lr = 0.001
weight_decay = 1e-5      # starting value, tuned on validation
max_epochs = 20
patience = 2             # epochs without test-mix weighted validation AUC improvement
